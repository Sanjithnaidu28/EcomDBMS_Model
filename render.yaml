services:
  - type: web
    name: shopdesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      # Live demo runs on the bundled SQLite copy of the database (demo/shopdesk_demo.db),
      # so no MySQL server is needed. Set DEMO_MODE to 0 and add DB_HOST, DB_PORT,
      # DB_USER, DB_PASSWORD and DB_NAME to use a real MySQL database instead.
      - key: DEMO_MODE
        value: "1"
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
